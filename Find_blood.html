<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --coral:#FF6B6B;
    --coral-deep:#E8524F;
    --teal:#17A398;
    --yellow:#FFC857;
    --cream:#FFF6EC;
    --ink:#322D52;
    --ink-soft:#8B8698;
    --line:#F0E4D3;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
    position:relative;
    overflow-x:hidden;
  }

  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(6px);
    opacity:0.35;
    z-index:0;
  }
  .blob1{width:280px;height:280px;background:var(--teal);top:-100px;left:-100px;}
  .blob2{width:220px;height:220px;background:var(--yellow);bottom:-80px;right:-80px;}
  .blob3{width:160px;height:160px;background:var(--coral);top:40%;right:-100px;opacity:0.25;}

  .card{
    width:100%;
    max-width:520px;
    background:#fff;
    border-radius:32px;
    box-shadow:0 24px 60px -20px rgba(50,45,82,0.25);
    position:relative;
    z-index:1;
    overflow:hidden;
  }

  .card-head{
    padding:38px 40px 20px;
    text-align:center;
  }

  .badge{
    width:64px;height:64px;
    background:linear-gradient(135deg, var(--coral), var(--coral-deep));
    border-radius:50% 50% 50% 0;
    transform:rotate(45deg);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 22px;
    box-shadow:0 10px 24px -8px rgba(232,82,79,0.55);
  }
  .badge svg{transform:rotate(-45deg);width:28px;height:28px;}

  h1{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:28px;
    line-height:1.2;
    margin:0 0 8px;
    color:var(--ink);
  }

  .sub{
    color:var(--ink-soft);
    font-size:14.5px;
    line-height:1.5;
    margin:0;
    font-weight:600;
  }

  form{padding:12px 40px 36px;}

  .field{
    margin-bottom:18px;
    border-radius:16px;
    background:var(--cream);
    padding:12px 16px;
    border:2px solid transparent;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .field:focus-within{
    border-color:var(--c-accent, var(--teal));
    background:#fff;
  }
  .field:nth-of-type(6n+1){--c-accent:var(--coral);}
  .field:nth-of-type(6n+2){--c-accent:var(--teal);}
  .field:nth-of-type(6n+3){--c-accent:var(--yellow);}
  .field:nth-of-type(6n+4){--c-accent:var(--coral);}
  .field:nth-of-type(6n+5){--c-accent:var(--teal);}
  .field:nth-of-type(6n+6){--c-accent:var(--yellow);}

  label{
    display:block;
    font-size:12px;
    font-weight:800;
    letter-spacing:0.01em;
    margin-bottom:4px;
    color:var(--ink-soft);
    text-transform:uppercase;
  }

  input[type="text"],
  input[type="email"],
  input[type="date"],
  select{
    width:100%;
    padding:4px 0 2px;
    border:none;
    background:transparent;
    font-family:'Nunito',sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--ink);
  }

  input:focus,select:focus{outline:none;}
  select{appearance:none;cursor:pointer;}

  .select-wrap{position:relative;}
  .select-wrap::after{
    content:'▾';
    position:absolute;
    right:0; top:2px;
    color:var(--ink-soft);
    font-size:14px;
    pointer-events:none;
  }

  .submit-btn{
    width:100%;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:17px;
    padding:15px 26px;
    margin-top:8px;
    background:linear-gradient(135deg, var(--coral), var(--coral-deep));
    color:#fff;
    border:none;
    border-radius:16px;
    cursor:pointer;
    box-shadow:0 12px 24px -8px rgba(232,82,79,0.5);
    transition:transform 0.12s ease, box-shadow 0.12s ease;
  }
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 16px 28px -8px rgba(232,82,79,0.6);}
  .submit-btn:active{transform:translateY(0);}
  .submit-btn:disabled{opacity:0.6;cursor:default;transform:none;}

  .state{
    display:none;
    padding:60px 40px;
    text-align:center;
  }
  .state.show{display:block;}
  .success-badge{
    width:80px;height:80px;
    background:linear-gradient(135deg, var(--teal), #0e8177);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 20px;
    box-shadow:0 12px 28px -8px rgba(23,163,152,0.5);
  }
  .success-badge svg{width:36px;height:36px;}
  .state h2{
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:24px;
    margin:0 0 8px;
    color:var(--ink);
  }
  .state p{color:var(--ink-soft);font-size:14.5px;font-weight:600;margin:0 0 24px;}
  .state .submit-btn{
    background:transparent;
    color:var(--teal);
    box-shadow:none;
    border:2px solid var(--teal);
    width:auto;
    padding:12px 28px;
  }
  .state .submit-btn:hover{background:var(--teal);color:#fff;}

  .error-msg{
    display:none;
    font-size:13px;
    font-weight:700;
    color:var(--coral-deep);
    margin-top:6px;
    text-align:center;
  }
  .error-msg.show{display:block;}

  @media (max-width:480px){
    .card-head, form{padding-left:26px;padding-right:26px;}
    h1{font-size:24px;}
  }
</style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="card">
  <div id="formView">
    <div class="card-head">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C12 2 5 11.5 5 16a7 7 0 0 0 14 0C19 11.5 12 2 12 2z"/></svg>
      </div>
      <h1>Quick Registration</h1>
      <p class="sub">Fill in your details below — takes under a minute</p>
    </div>

    <form id="feedbackForm">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Manish Shrestha" required>
      </div>

      <div class="field">
        <label for="address">Address</label>
        <input type="text" id="address" name="address" placeholder="Kathmandu, Nepal" required>
      </div>

      <div class="field">
        <label for="contact">Contact Number</label>
        <input type="text" id="contact" name="contact" placeholder="98XXXXXXXX" required>
      </div>

      <div class="field">
        <label for="email">Mail Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required>
      </div>

      <div class="field select-wrap">
        <label for="bloodGroup">Blood Group</label>
        <select id="bloodGroup" name="bloodGroup" required>
          <option value="" disabled selected>Select blood group</option>
          <option value="A+">A+</option>
          <option value="A-">A-</option>
          <option value="B+">B+</option>
          <option value="B-">B-</option>
          <option value="AB+">AB+</option>
          <option value="AB-">AB-</option>
          <option value="O+">O+</option>
          <option value="O-">O-</option>
        </select>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
      <div class="error-msg" id="errorMsg">Couldn't send that — check your connection and try again.</div>
    </form>
  </div>

  <div class="state" id="successView">
    <div class="success-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h2>All set!</h2>
    <p>Thanks — your details have been recorded.</p>
    <button class="submit-btn" id="resetBtn">Submit another</button>
  </div>
</div>

<script>
  // === CONFIGURE THIS ===
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwox1TGejTfNBeASdL_e-70semzGtgcmHuLLWecshCEpsKMe2G_gIxlKrljH_tKz7cSOw/exec";

  const form = document.getElementById('feedbackForm');
  const submitBtn = document.getElementById('submitBtn');
  const errorMsg = document.getElementById('errorMsg');
  const formView = document.getElementById('formView');
  const successView = document.getElementById('successView');
  const resetBtn = document.getElementById('resetBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('show');

    if (SCRIPT_URL.includes('PASTE_YOUR')) {
      errorMsg.textContent = 'Set SCRIPT_URL in the code first (see setup instructions).';
      errorMsg.classList.add('show');
      return;
    }

    const payload = {
      timestamp: new Date().toISOString(),
      name: document.getElementById('name').value,
      address: document.getElementById('address').value,
      contact: document.getElementById('contact').value,
      email: document.getElementById('email').value,
      dob: document.getElementById('dob').value,
      bloodGroup: document.getElementById('bloodGroup').value
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      formView.style.display = 'none';
      successView.classList.add('show');
    } catch (err) {
      errorMsg.textContent = "Couldn't send that — check your connection and try again.";
      errorMsg.classList.add('show');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit';
    }
  });

  resetBtn.addEventListener('click', () => {
    form.reset();
    successView.classList.remove('show');
    formView.style.display = 'block';
    errorMsg.classList.remove('show');
  });
</script>

</body>
</html>
