<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Graphics | Manish</title>
<meta name="description" content="Posters and graphic design work by Manish." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0d0a18;--fg:#f4efe6;--mut:#9a95b2;--coral:#ff6b5b;--sky:#4fb9f5;--sun:#ffd23f;--e:cubic-bezier(.22,1,.36,1);--pad:clamp(18px,4vw,44px)}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;color:var(--fg);background:var(--bg);font:500 1.05rem/1.6 Nunito,system-ui,sans-serif;overflow-x:clip}
body.lock{overflow:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:4px}
h1,h2{font-family:'Baloo 2',sans-serif;line-height:.9;margin:0;font-weight:800;text-transform:uppercase}
nav{position:fixed;inset:0 0 auto;z-index:50;display:flex;justify-content:space-between;padding:22px var(--pad);mix-blend-mode:difference;color:#fff;font:800 1.1rem 'Baloo 2',sans-serif}
nav a{text-decoration:none}
/* preloader */
.pre{position:fixed;inset:0;z-index:100;background:var(--coral);color:#1b1530;display:flex;align-items:flex-end;justify-content:space-between;padding:var(--pad);transition:transform .9s var(--e) .1s}
.pre.done{transform:translateY(-100%)}
.pre b{font:800 clamp(5rem,22vw,16rem)/.8 'Baloo 2',sans-serif}
.pre span{font:800 1.2rem 'Baloo 2',sans-serif;text-transform:uppercase}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:110px var(--pad) 170px;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:float 14s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;background:var(--coral);left:-12vmax;top:-10vmax}
.b2{width:38vmax;height:38vmax;background:var(--sky);right:-10vmax;top:18vh;animation-delay:-5s}
.b3{width:28vmax;height:28vmax;background:var(--sun);left:30vw;bottom:-14vmax;animation-delay:-9s;opacity:.35}
@keyframes float{to{transform:translate(6vmax,-5vmax) scale(1.15)}}
.hero h1{position:relative;font-size:clamp(3.6rem,17.5vw,17rem);letter-spacing:-.02em;display:flex;flex-wrap:wrap}
.hero h1 span{display:inline-block;opacity:0;translate:0 60%;transition:transform .3s var(--e);color:color-mix(in srgb,var(--coral) calc(var(--s,0)*100%),var(--fg))}
.ready .hero h1 span{animation:letter .9s var(--e) forwards,wave 4s ease-in-out infinite;animation-delay:calc(var(--i)*60ms),calc(1.3s + var(--i)*150ms)}
@keyframes letter{to{opacity:1;translate:0 0}}
@keyframes wave{0%,100%{translate:0 0}50%{translate:0 -7%}}
.meta{position:relative;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:28px;color:var(--mut);font-weight:700}
.meta strong{color:var(--fg)}
.mq{position:absolute;left:0;right:0;bottom:34px;overflow:hidden;white-space:nowrap;font:800 clamp(2.6rem,8vw,6rem)/1 'Baloo 2',sans-serif;text-transform:uppercase;-webkit-text-stroke:2px var(--fg);color:transparent}
.mq div{display:inline-block;will-change:transform}
/* showcase */
.sticky{padding:60px var(--pad) 40px}
.track{display:flex;flex-direction:column;gap:28px}
.intro{font-size:clamp(2.4rem,9vw,5rem)}
.intro em{font-style:normal;color:var(--coral)}
.card{position:relative;display:block;flex:none;width:100%;aspect-ratio:var(--ar,.75);border:0;padding:0;border-radius:18px;overflow:hidden;background:#1b1530;cursor:pointer}
.card img{position:absolute;top:0;left:-30px;width:calc(100% + 60px);height:100%;object-fit:cover;opacity:0;transition:opacity .6s,scale .6s var(--e);translate:var(--px,0) 0}
.card.loaded img{opacity:1}
.card:hover img{scale:1.06}
.card .n{position:absolute;left:18px;bottom:10px;font:800 clamp(3rem,6vw,5rem)/1 'Baloo 2',sans-serif;color:transparent;-webkit-text-stroke:2px #fff;pointer-events:none}
.card .t{position:absolute;right:14px;top:14px;background:var(--fg);color:#1b1530;font:800 .95rem 'Baloo 2',sans-serif;padding:2px 12px;border-radius:99px;opacity:0;translate:0 -8px;transition:.3s}
.card:hover .t,.card:focus-visible .t{opacity:1;translate:0 0}
.count{display:none}
.h .pin{height:var(--ph)}
.h .sticky{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;align-items:center;padding:0}
.h .track{position:relative;flex:none;width:max-content;flex-direction:row;align-items:center;gap:4vw;padding:0 8vw;will-change:transform}
.h .intro{flex:none;width:34vw}
.h .card{width:auto;height:min(72vh,680px)}
.h .count{display:flex;position:absolute;left:var(--pad);right:var(--pad);bottom:26px;align-items:center;gap:16px;font:800 1.1rem 'Baloo 2',sans-serif}
.bar{flex:1;height:3px;background:#ffffff22;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);transform-origin:left;transform:scaleX(0)}
/* outro */
.out{padding:14vh var(--pad) 8vh;text-align:center}
.out h2{font-size:clamp(2.8rem,12vw,10rem)}
.out em{font-style:normal;color:var(--coral)}
.mail{display:inline-block;margin-top:36px;font:800 clamp(1.2rem,3vw,2rem) 'Baloo 2',sans-serif;padding:16px 34px;border-radius:99px;background:var(--sun);color:#1b1530;text-decoration:none;will-change:transform}
.links{margin-top:28px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap;color:var(--mut);font-weight:700}
.links a{text-decoration:none}.links a:hover{color:var(--fg)}
/* cursor */
.cur{position:fixed;left:0;top:0;z-index:90;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--fg);mix-blend-mode:difference;pointer-events:none;display:none;place-items:center;transition:width .3s var(--e),height .3s var(--e),margin .3s var(--e)}
.cur.on{display:grid}
.cur.view{width:92px;height:92px;margin:-46px 0 0 -46px;background:var(--coral);mix-blend-mode:normal}
.cur.link{width:46px;height:46px;margin:-23px 0 0 -23px}
.cur span{font:800 .95rem 'Baloo 2',sans-serif;color:#1b1530;opacity:0}
.cur.view span{opacity:1}
/* viewer */
dialog{border:0;padding:0;background:transparent;width:100vw;height:100vh;max-width:100vw;max-height:100vh}
dialog::backdrop{background:rgba(8,5,18,.94)}
.lb{height:100%;display:grid;grid-template-rows:1fr auto;place-items:center;padding:56px 76px 18px}
.stage{min-height:0;max-width:100%;max-height:100%;display:grid;place-items:center;touch-action:pan-y}
.stage img{max-width:100%;max-height:calc(100vh - 150px);border-radius:10px;background:#fff;animation:zoom .4s var(--e)}
@keyframes zoom{from{opacity:0;transform:translateX(calc(var(--dir,0)*80px)) scale(.94)}}
.info{display:flex;gap:12px;align-items:baseline;margin-top:12px;font-weight:700}
.info .c{color:var(--mut);font-weight:500;font-size:.95rem}
.nv,.x{position:absolute;width:46px;height:46px;display:grid;place-items:center;cursor:pointer;border:0;color:#fff;background:#ffffff1f;border-radius:50%;font-size:1.6rem;line-height:1}
.nv:hover,.x:hover{background:#ffffff3d}
.pv{left:14px;top:50%;margin-top:-23px}.nx{right:14px;top:50%;margin-top:-23px}.x{top:14px;right:14px}
@media (max-width:640px){.lb{padding:64px 12px 12px}.pv,.nx{top:auto;bottom:14px;margin:0}.info{margin-bottom:54px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero h1 span{opacity:1;translate:none}.blob{display:none}html{scroll-behavior:auto}}
</style>
</head>
<body class="lock">
<div class="pre" aria-hidden="true"><span>Manish &middot; Graphics</span><b>0</b></div>
<div class="cur" id="cur" aria-hidden="true"><span>View</span></div>
<nav><a href="index.html">&larr; Manish</a><a href="#contact">Contact</a></nav>

<header class="hero">
  <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
  <h1>Graphics</h1>
  <div class="meta"><span><strong>Manish</strong> &middot; Graphic designer, Nepal</span><span id="total"></span><span>Scroll &darr;</span></div>
  <div class="mq" aria-hidden="true"><div id="mq"></div></div>
</header>

<main class="show" id="show">
  <div class="pin" id="pin"><div class="sticky">
    <div class="track" id="track"><h2 class="intro">Selected <em>work</em> &rarr;</h2></div>
    <div class="count"><span id="cnt"></span><div class="bar"><i id="fill"></i></div></div>
  </div></div>
</main>

<footer class="out" id="contact">
  <h2>Got a <em>project?</em><br>Let&rsquo;s talk.</h2>
  <a class="mail" id="mail" href="mailto:mail@manishcrestha.com.np">Say hello</a>
  <div class="links"><a href="index.html">Home</a><a href="https://www.instagram.com/manishshrestha_" target="_blank" rel="noopener">Instagram</a><a href="https://www.linkedin.com/in/manishshrestha09" target="_blank" rel="noopener">LinkedIn</a></div>
</footer>

<dialog id="lbx" aria-label="Image viewer"><div class="lb">
  <button class="x" id="cl" aria-label="Close">&times;</button>
  <button class="nv pv" id="pv" aria-label="Previous">&#8249;</button>
  <div class="stage" id="stg"><img id="big" alt="" /></div>
  <button class="nv nx" id="nx" aria-label="Next">&#8250;</button>
  <div class="info"><span id="ttl"></span><span class="c" id="ct"></span></div>
</div></dialog>

<script>
// To add a piece: add a line [file name in the Graphics folder, title (optional)]
var BASE='assets/img/portfolio/Graphics/';
var works=[['CR7.png','GOAT'],['Balen-poster.png','Election'],['Sandeep_Poster_Final.png','Sandy'],['graphics1.png',''],['Easwarmma poster - final.png','Easwaramma Day'],['Admission.png','Balvikas admission open'],['graphics2.png',''],['graphics3.png',''],['budha poornima.png','Buddha Poornima'],['graphics4.jpg',''],['graphics5.png',''],['graphics6.png',''],['Aradhana Mahotsav.png','Aradhana Mahotsav'],['graphics7.png',''],['graphics8.png',''],['graphics9.jpg',''],['graphics10.png',''],['New year.png','New Year'],['Easwarmma poster - for post.png','Easwaramma']];
var $=function(s){return document.querySelector(s)},html=document.documentElement;
var calm=matchMedia('(prefers-reduced-motion: reduce)').matches,fine=matchMedia('(hover: hover) and (pointer: fine)').matches;
function src(i){return BASE+encodeURI(works[i][0])}
function pad(n){return n<10?'0'+n:''+n}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
$('#total').textContent=works.length+' pieces';

// preloader
var pre=$('.pre');
function ready(){pre.classList.add('done');document.body.classList.remove('lock');html.classList.add('ready');setTimeout(function(){pre.remove()},1300)}
if(calm){pre.remove();document.body.classList.remove('lock');html.classList.add('ready')}
else{var t0=performance.now(),num=$('.pre b');(function f(){var k=Math.min(1,(performance.now()-t0)/1400);num.textContent=Math.round(k*k*(3-2*k)*100);k<1?requestAnimationFrame(f):setTimeout(ready,150)})()}

// hero letters react to the pointer
var h1=$('.hero h1'),word=h1.textContent.trim();h1.setAttribute('aria-label',word);h1.textContent='';
var letters=word.split('').map(function(ch,i){var s=document.createElement('span');s.textContent=ch;s.style.setProperty('--i',i);s.setAttribute('aria-hidden','true');h1.appendChild(s);return s});
if(fine&&!calm)addEventListener('pointermove',function(e){
  if(scrollY>innerHeight)return;
  letters.forEach(function(l){var r=l.getBoundingClientRect(),d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2)),s=Math.max(0,1-d/280);
    l.style.transform='translateY('+(-s*26)+'px) scale('+(1+s*.22)+')';l.style.setProperty('--s',s.toFixed(2))})});

// marquee words
var mq=$('#mq'),unit='Posters \u2726 Social media \u2726 Festivals \u2726 Branding \u2726 Design \u2726 ';
mq.textContent=unit+unit+unit+unit;mq.appendChild(mq.firstChild.cloneNode());mq.firstChild.textContent=unit+unit+unit+unit;
var mqx=0;

// cards
var show=$('#show'),pin=$('#pin'),track=$('#track'),cnt=$('#cnt'),fill=$('#fill'),cards=[];
works.forEach(function(w,i){
  var b=document.createElement('button');b.type='button';b.className='card';b.setAttribute('aria-label','Open '+(w[1]||'design '+pad(i+1)));
  b.innerHTML='<img alt="'+(w[1]||'Graphic design '+pad(i+1))+'" decoding="async"><span class="n">'+pad(i+1)+'</span>'+(w[1]?'<span class="t">'+w[1]+'</span>':'');
  var im=b.firstChild;
  im.onload=function(){b.style.setProperty('--ar',im.naturalWidth/im.naturalHeight);b.classList.add('loaded');layout()};
  im.onerror=function(){b.style.display='none';layout()};
  im.src=src(i);
  b.addEventListener('click',function(){openLb(i)});
  track.appendChild(b);cards.push(b);
});

// pinned horizontal scroll (desktop) / vertical stack (mobile, reduced motion)
var horiz=false,maxX=0,pinTop=0,lefts=[];
function layout(){
  horiz=!calm&&innerWidth>=800&&innerHeight>=480;
  show.classList.toggle('h',horiz);
  if(!horiz){track.style.transform='';cards.forEach(function(c){c.style.removeProperty('--px')});pin.style.removeProperty('--ph');return}
  maxX=Math.max(0,track.offsetWidth-innerWidth);
  pin.style.setProperty('--ph',(maxX+innerHeight)+'px');
  pinTop=pin.getBoundingClientRect().top+scrollY;
  lefts=cards.map(function(c){return c.offsetLeft+c.offsetWidth/2});
}
addEventListener('resize',layout);layout();
if(document.fonts)document.fonts.ready.then(layout);
cards.forEach(function(c,i){c.addEventListener('focus',function(){
  if(!horiz)return;var p=clamp((lefts[i]-innerWidth/2)/maxX,0,1);
  scrollTo({top:pinTop+p*(pin.offsetHeight-innerHeight)})})});

// cursor
var cur=$('#cur'),mx=0,my=0,cx=0,cy=0;
if(fine&&!calm){
  addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;cur.classList.add('on')});
  document.addEventListener('pointerover',function(e){var t=e.target,card=t.closest&&t.closest('.card');
    cur.classList.toggle('view',!!card);cur.classList.toggle('link',!card&&!!(t.closest&&t.closest('a,button')))});
}

// magnetic button
var mail=$('#mail');
if(fine&&!calm){
  mail.addEventListener('pointermove',function(e){var r=mail.getBoundingClientRect();mail.style.transform='translate('+((e.clientX-r.left-r.width/2)*.3)+'px,'+((e.clientY-r.top-r.height/2)*.4)+'px)'});
  mail.addEventListener('pointerleave',function(){mail.style.transform=''});
}

// frame loop
var curX=0,lastY=scrollY,sv=0,half=0;
function tick(){
  var y=scrollY;sv+=((y-lastY)-sv)*.15;lastY=y;
  if(horiz){
    var p=clamp((y-pinTop)/Math.max(1,pin.offsetHeight-innerHeight),0,1),target=-p*maxX,prev=curX;
    curX+=(target-curX)*.1;var vel=curX-prev;
    track.style.transform='translate3d('+curX.toFixed(1)+'px,0,0) skewX('+clamp(vel*-.15,-8,8).toFixed(2)+'deg)';
    var idx=0,best=1e9;
    cards.forEach(function(c,i){var dx=lefts[i]+curX-innerWidth/2;if(Math.abs(dx)<best){best=Math.abs(dx);idx=i}
      c.style.setProperty('--px',clamp(-dx/innerWidth*60,-30,30).toFixed(1)+'px')});
    cnt.textContent=pad(idx+1)+' / '+pad(works.length);fill.style.transform='scaleX('+p+')';
  }
  if(!calm&&y<innerHeight*1.2){
    half=half||mq.firstChild.offsetWidth||mq.scrollWidth/2;
    mqx-=1.2+sv*.4;if(mqx<=-half)mqx+=half;if(mqx>0)mqx-=half;
    mq.style.transform='translateX('+mqx.toFixed(1)+'px)';
  }
  cx+=(mx-cx)*.2;cy+=(my-cy)*.2;cur.style.transform='translate('+cx.toFixed(1)+'px,'+cy.toFixed(1)+'px)';
  requestAnimationFrame(tick);
}
if(!calm)requestAnimationFrame(tick);

// viewer
var dlg=$('#lbx'),big=$('#big'),now=0;
function showLb(d){
  big.style.setProperty('--dir',d||0);big.style.animation='none';void big.offsetWidth;big.style.animation='';
  big.src=src(now);big.alt=works[now][1]||'Graphic design '+pad(now+1);
  $('#ttl').textContent=works[now][1];$('#ct').textContent=(now+1)+' / '+works.length;
  [1,-1].forEach(function(k){new Image().src=src((now+k+works.length)%works.length)});
}
function openLb(i){now=i;showLb(0);if(!dlg.open)dlg.showModal()}
function step(d){now=(now+d+works.length)%works.length;showLb(d)}
$('#cl').onclick=function(){dlg.close()};$('#pv').onclick=function(){step(-1)};$('#nx').onclick=function(){step(1)};
dlg.addEventListener('click',function(e){if(e.target===dlg||e.target.classList.contains('lb')||e.target.id==='stg')dlg.close()});
document.addEventListener('keydown',function(e){if(!dlg.open)return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
var x0=null,stg=$('#stg');
stg.addEventListener('pointerdown',function(e){x0=e.clientX});
stg.addEventListener('pointerup',function(e){if(x0===null)return;var dx=e.clientX-x0;x0=null;if(Math.abs(dx)>50)step(dx<0?1:-1)});
</script>
</body>
</html>
