<style>
  :root {
    --ink: #1b1530;
    --paper: #f3f9ff;
    --card: #ffffff;
    --coral: #ff6b5b;
    --sky: #4fb9f5;
    --sun: #ffd23f;
    --mint: #7ee0b0;
    --line: 4px;
    --shadow: 6px 6px 0 var(--ink);
    --radius: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #17122b; --card: #231c40; --ink: #fff6e0; }
    .tile .label, .btn, .badge-chip { color: #1b1530; }
    .tile .thumb { border-color: #fff6e0; }
    .modal-card { color: #1b1530; background: #fff; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: 'Nunito', system-ui, sans-serif;
    font-size: 1.1rem;
    line-height: 1.5;
    color: var(--ink);
    background-color: var(--paper);
    /* pixel grid */
    background-image:
      linear-gradient(color-mix(in srgb, var(--ink) 7%, transparent) 2px, transparent 2px),
      linear-gradient(90deg, color-mix(in srgb, var(--ink) 7%, transparent) 2px, transparent 2px);
    background-size: 28px 28px;
  }
  h1, h2, h3 { font-family: 'Baloo 2', 'Nunito', sans-serif; line-height: 1.05; margin: 0; }
  a { color: inherit; }
  :focus-visible { outline: 4px solid var(--coral); outline-offset: 3px; }

  .wrap { width: min(1060px, 100% - 32px); margin-inline: auto; }

  /* ---------- Profile card (hero) ---------- */
  .profile {
    margin-top: 20px;
    background: var(--card);
    border: var(--line) solid var(--ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .cover {
    height: clamp(150px, 26vw, 260px);
    background: linear-gradient(135deg, var(--sky), var(--sun));
    border-bottom: var(--line) solid var(--ink);
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: auto; }
  .profile-body {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: end;
    gap: 8px 24px;
    padding: 0 28px 26px;
  }
  .avatar {
    width: clamp(110px, 16vw, 168px);
    aspect-ratio: 1;
    border-radius: 50%;
    border: var(--line) solid var(--ink);
    box-shadow: 5px 5px 0 var(--coral);
    background: var(--sun);
    object-fit: cover;
    margin-top: calc(clamp(110px, 16vw, 168px) / -2);
    position: relative;
  }
  .who { padding-top: 14px; }
  .who h1 { font-size: clamp(2.6rem, 7vw, 4.4rem); font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .who h1 img { width: 0.55em; height: 0.55em; object-fit: contain; }
  .who p { margin: 6px 0 0; font-weight: 700; }
  .badge-chip {
    display: inline-block; background: var(--sun); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 999px; padding: 1px 14px;
  }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; padding-top: 14px; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font: 800 1.1rem 'Baloo 2', sans-serif;
    color: var(--ink); text-decoration: none; cursor: pointer;
    background: var(--sun);
    border: 3px solid var(--ink); border-radius: 14px;
    padding: 8px 18px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform .1s, box-shadow .1s;
  }
  .btn.coral { background: var(--coral); }
  .btn.sky { background: var(--sky); }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  .btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
  .btn { color: #1b1530; }

  @media (max-width: 720px) {
    .profile-body { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 0 18px 22px; }
    .who h1 { justify-content: center; }
    .actions { justify-content: center; }
  }

  /* ---------- Tiles ---------- */
  section { margin-top: 56px; }
  .section-title { font-size: clamp(2rem, 5vw, 2.8rem); font-weight: 800; margin-bottom: 4px; }
  .section-sub { margin: 0 0 24px; font-weight: 700; opacity: .75; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 28px; }
  .tile {
    display: block; text-decoration: none;
    background: var(--card);
    border: var(--line) solid var(--ink);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: transform .12s, box-shadow .12s;
  }
  .tile:nth-child(odd) { transform: rotate(-.7deg); }
  .tile:nth-child(even) { transform: rotate(.7deg); }
  .tile:hover, .tile:focus-visible { transform: translate(-3px, -3px) rotate(0); box-shadow: 10px 10px 0 var(--ink); }
  .tile:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--ink); }
  .tile .thumb { height: 180px; border-bottom: var(--line) solid var(--ink); background: var(--c, var(--sky)); }
  .tile .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .label {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px 18px; background: var(--c, var(--sky)); color: #1b1530;
  }
  .tile h3 { font-size: 1.6rem; font-weight: 800; }
  .tile .go { font-size: 1.2rem; }
  .tile:nth-child(6n+1) { --c: var(--coral); }
  .tile:nth-child(6n+2) { --c: var(--sky); }
  .tile:nth-child(6n+3) { --c: var(--sun); }
  .tile:nth-child(6n+4) { --c: var(--mint); }
  .tile:nth-child(6n+5) { --c: var(--coral); }
  .tile:nth-child(6n)   { --c: var(--sky); }

  /* ---------- Support ---------- */
  .support {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px;
    background: var(--sun); color: #1b1530;
    border: var(--line) solid var(--ink); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 24px 28px;
  }
  .support h2 { font-size: 2rem; font-weight: 800; }
  .support p { margin: 4px 0 0; font-weight: 700; }
  .support .btn { background: #fff; }

  /* ---------- Footer ---------- */
  footer { margin-top: 64px; padding: 36px 0 44px; background: var(--ink); color: var(--paper); text-align: center; border-top: var(--line) solid var(--ink); }
  @media (prefers-color-scheme: dark) { footer { background: #0e0a1d; color: #fff6e0; } }
  footer h2 { font-size: 1.8rem; margin-bottom: 14px; }
  .socials { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }
  .socials a {
    width: 54px; height: 54px; display: grid; place-items: center; font-size: 1.4rem;
    color: #1b1530; text-decoration: none;
    background: var(--sun); border: 3px solid #fff; border-radius: 14px; box-shadow: 4px 4px 0 var(--coral);
    transition: transform .1s, box-shadow .1s;
  }
  .socials a:nth-child(2n) { background: var(--sky); }
  .socials a:nth-child(3n) { background: var(--mint); }
  .socials a:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--coral); }
  .mantra { margin: 26px 0 0; font-family: 'Baloo 2', sans-serif; font-size: 1.25rem; font-weight: 700; opacity: .85; }

  /* ---------- QR dialog ---------- */
  dialog { border: 0; background: transparent; padding: 0; max-width: 92vw; }
  dialog::backdrop { background: rgba(27, 21, 48, .6); backdrop-filter: blur(5px); }
  .modal-card {
    background: #fff; color: #1b1530; text-align: center;
    border: var(--line) solid #1b1530; border-radius: var(--radius); box-shadow: 8px 8px 0 #1b1530;
    padding: 22px 22px 26px;
  }
  .modal-card img { width: min(70vmin, 340px); height: auto; display: block; margin: 0 auto 14px; border: 3px solid #1b1530; border-radius: 12px; padding: 8px; }
  .modal-card h2 { font-size: 2rem; margin-bottom: 14px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
    .tile:nth-child(odd), .tile:nth-child(even) { transform: none; }
  }

  /* ================= ANIMATION ================= */
  :root { --snap: cubic-bezier(.34, 1.56, .64, 1); }

  /* floating pixel shapes behind everything */
  .decor { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .decor i {
    position: absolute; display: block; width: var(--s, 26px); height: var(--s, 26px);
    background: var(--c); border: 3px solid var(--ink); opacity: .9;
    animation: drift var(--t, 14s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s);
  }
  .decor .star { clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); border: 0; }
  .decor .ring { border-radius: 50%; background: transparent; }
  @keyframes drift {
    from { transform: translate(0, 0) rotate(0deg); }
    to   { transform: translate(var(--x, 30px), var(--y, -60px)) rotate(var(--r, 90deg)); }
  }

  /* page-load sequence: card pops, avatar bounces, name letters hop in */
  .profile { animation: card-in .7s var(--snap) backwards; }
  .cover img { animation: cover-pan 18s ease-in-out infinite alternate; transform-origin: center; }
  .avatar { animation: avatar-in .8s var(--snap) .35s backwards; transition: transform .2s var(--snap); }
  .avatar:hover { animation: wiggle .5s ease-in-out; }
  .name span { display: inline-block; animation: hop .6s var(--snap) backwards; animation-delay: calc(.6s + var(--i) * .07s); }
  .who h1 img { animation: pop-badge .5s var(--snap) 1.25s backwards, pulse 3.5s ease-in-out 3s infinite; }
  .who p, .actions .btn { animation: rise .5s ease-out backwards; }
  .who p { animation-delay: 1.1s; }
  .actions .btn:nth-child(1) { animation-delay: 1.2s; }
  .actions .btn:nth-child(2) { animation-delay: 1.3s; }
  @keyframes card-in { from { opacity: 0; transform: translateY(40px) scale(.94); } }
  @keyframes avatar-in { from { opacity: 0; transform: translateY(-40px) scale(.4) rotate(-25deg); } }
  @keyframes hop { 0% { opacity: 0; transform: translateY(40px) rotate(-12deg) scale(.6); } 100% { opacity: 1; } }
  @keyframes pop-badge { from { opacity: 0; transform: scale(0) rotate(-90deg); } }
  @keyframes pulse { 0%, 88%, 100% { transform: scale(1); } 94% { transform: scale(1.35) rotate(10deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg) scale(1.05); } 75% { transform: rotate(8deg) scale(1.05); } }
  @keyframes cover-pan { from { transform: scale(1.02); } to { transform: scale(1.12) translateX(-1.5%); } }

  /* tiles: pop in on scroll, thumbnails zoom, light sweep on hover */
  .js .tile:not(.in) { opacity: 0; transform: translateY(46px) scale(.9); transition: none; }
  .tile.in { animation: tile-in .65s var(--snap) backwards; animation-delay: var(--d, 0s); }
  @keyframes tile-in { from { opacity: 0; transform: translateY(46px) scale(.9) rotate(4deg); } }
  .tile .thumb { position: relative; overflow: hidden; }
  .tile .thumb img { transition: transform .5s ease; }
  .tile:hover .thumb img, .tile:focus-visible .thumb img { transform: scale(1.12); }
  .tile .thumb::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-18deg);
  }
  .tile:hover .thumb::after { animation: sweep .7s ease-out; }
  @keyframes sweep { to { left: 130%; } }
  .tile .go { transition: transform .2s var(--snap); }
  .tile:hover .go { transform: translateX(6px) rotate(-8deg) scale(1.2); }

  /* section headings and support card */
  .js .reveal:not(.in) { opacity: 0; transform: translateY(26px); }
  .reveal.in { animation: rise-big .6s var(--snap) backwards; }
  @keyframes rise-big { from { opacity: 0; transform: translateY(26px); } }
  .support .btn { animation: nudge 3s ease-in-out 2s infinite; }
  @keyframes nudge { 0%, 90%, 100% { transform: translate(0,0); } 93% { transform: translate(-3px,-3px) rotate(-2deg); } 97% { transform: translate(3px,-2px) rotate(2deg); } }

  /* socials bounce on hover */
  .socials a:hover { animation: wiggle .45s ease-in-out; }

  /* QR dialog */
  dialog[open] .modal-card { animation: dialog-in .45s var(--snap); }
  dialog[open]::backdrop { animation: fade .3s ease-out; }
  @keyframes dialog-in { from { opacity: 0; transform: scale(.5) rotate(-6deg) translateY(40px); } }
  @keyframes fade { from { opacity: 0; } }

  /* pixel confetti */
  .bit { position: fixed; z-index: 2000; width: 12px; height: 12px; border: 2px solid #1b1530; pointer-events: none; animation: burst .9s ease-out forwards; }
  @keyframes burst { to { transform: translate(var(--dx), var(--dy)) rotate(var(--dr)); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    .decor, .bit { display: none; }
    .profile, .avatar, .name span, .who h1 img, .who p, .actions .btn, .cover img, .support .btn,
    .tile.in, .reveal.in, dialog[open] .modal-card { animation: none !important; }
    .js .tile:not(.in), .js .reveal:not(.in) { opacity: 1; transform: none; }
  }
</style>

<script>
  (function () {
    var root = document.documentElement;
    root.classList.add('js');
    var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // split the name into hopping letters
    var name = document.querySelector('.name');
    if (name && !calm) {
      var t = name.textContent; name.textContent = '';
      name.setAttribute('aria-label', t);
      t.split('').forEach(function (ch, i) {
        var sp = document.createElement('span');
        sp.textContent = ch; sp.style.setProperty('--i', i); sp.setAttribute('aria-hidden', 'true');
        name.appendChild(sp);
      });
    }

    // reveal tiles and headings as they scroll into view
    var items = document.querySelectorAll('.tile, .reveal');
    document.querySelectorAll('.tile').forEach(function (el, i) { el.style.setProperty('--d', (i % 3) * 0.1 + 's'); });
    if (calm || !('IntersectionObserver' in window)) {
      items.forEach(function (el) { el.classList.add('in'); });
    } else {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
      }, { threshold: 0.15 });
      items.forEach(function (el) { io.observe(el); });
    }

    // pixel confetti burst
    function burst(x, y) {
      if (calm) return;
      var colors = ['#ff6b5b', '#4fb9f5', '#ffd23f', '#7ee0b0'];
      for (var i = 0; i < 18; i++) {
        var b = document.createElement('span'); b.className = 'bit';
        var a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 110;
        b.style.left = x + 'px'; b.style.top = y + 'px';
        b.style.background = colors[i % 4];
        b.style.setProperty('--dx', Math.cos(a) * d + 'px');
        b.style.setProperty('--dy', Math.sin(a) * d + 'px');
        b.style.setProperty('--dr', (Math.random() * 360) + 'deg');
        document.body.appendChild(b);
        setTimeout(function (n) { n.remove(); }, 1000, b);
      }
    }
    document.getElementById('showQr').addEventListener('click', function (e) {
      var r = e.currentTarget.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2);
    });
    document.querySelectorAll('.socials a').forEach(function (a) {
      a.addEventListener('click', function (e) { burst(e.clientX, e.clientY); });
    });
  })();
</script>
