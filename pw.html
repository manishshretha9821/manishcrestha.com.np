<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#2563eb">
<title>Live Google Sheet</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f6fa;
  color:#172033;
}
.header{
  background:#2563eb;
  color:white;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 8px #0002;
}
.header h1{
  margin:0 0 5px;
  font-size:21px;
}
#status{
  font-size:12px;
  opacity:.9;
}
.container{
  padding:14px 10px 30px;
  max-width:1400px;
  margin:auto;
}
.search-box{
  position:sticky;
  top:78px;
  z-index:5;
  background:#f3f6fa;
  padding:8px 0 12px;
}
#search{
  width:100%;
  border:1px solid #d5dbe5;
  border-radius:12px;
  padding:13px 15px;
  font-size:15px;
  outline:none;
  background:white;
  box-shadow:0 2px 7px #0000000b;
}
#search:focus{
  border-color:#2563eb;
}
.table-card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 10px #0000000d;
}
.table-scroll{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
table{
  border-collapse:collapse;
  width:100%;
  min-width:650px;
  font-size:14px;
}
th,td{
  padding:12px 11px;
  border-bottom:1px solid #e8ebef;
  text-align:left;
  white-space:nowrap;
}
th{
  background:#eef3ff;
  color:#1e3a8a;
  font-weight:600;
  position:sticky;
  top:0;
  z-index:2;
}
tbody tr:active td{
  background:#f5f8ff;
}
.empty{
  padding:25px;
  text-align:center;
  color:#777;
}
.footer{
  text-align:center;
  color:#8a919d;
  font-size:11px;
  padding:15px 0;
}

@media(max-width:600px){
  .header{
    padding:15px 13px;
  }
  .header h1{
    font-size:18px;
  }
  .container{
    padding:10px 7px 25px;
  }
  .search-box{
    top:67px;
  }
  #search{
    padding:12px 13px;
    font-size:14px;
  }
  .table-card{
    border-radius:10px;
  }
  table{
    font-size:13px;
    min-width:600px;
  }
  th,td{
    padding:11px 9px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>Live Google Sheet</h1>
  <div id="status">Loading...</div>
</header>

<main class="container">

  <div class="search-box">
    <input
      id="search"
      type="search"
      placeholder="🔍 Search anything..."
      autocomplete="off"
    >
  </div>

  <div class="table-card">
    <div class="table-scroll">
      <table id="sheetTable"></table>
    </div>
  </div>

  <div class="footer">
    Data automatically refreshes every 30 seconds
  </div>

</main>

<script>
const SHEET_ID = "19uDkBf43rqG8i0TeuLRUmyJIB6WfYXSa";
const GID = "1427188598";
const REFRESH_MS = 30000;

let allRows = [];
let headers = [];

function getUrl(){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&t=${Date.now()}`;
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function render(rows){
  const table = document.getElementById("sheetTable");

  if(!rows.length){
    table.innerHTML = `
      <tbody>
        <tr><td class="empty">No matching data found.</td></tr>
      </tbody>`;
    return;
  }

  let html = "<thead><tr>";

  headers.forEach(h=>{
    html += `<th>${escapeHtml(h)}</th>`;
  });

  html += "</tr></thead><tbody>";

  rows.forEach(row=>{
    html += "<tr>";

    row.forEach(value=>{
      html += `<td>${escapeHtml(value)}</td>`;
    });

    html += "</tr>";
  });

  html += "</tbody>";
  table.innerHTML = html;
}

async function loadSheet(){
  const status = document.getElementById("status");

  try{
    const response = await fetch(getUrl(), {cache:"no-store"});

    if(!response.ok)
      throw new Error("Unable to connect to Google Sheet.");

    const text = await response.text();

    const match = text.match(
      /google\.visualization\.Query\.setResponse\(([\s\S]*)\);/
    );

    if(!match)
      throw new Error("Invalid Google Sheet response.");

    const data = JSON.parse(match[1]);
    const table = data.table;

    headers = table.cols.map(col => col.label || "");

    allRows = table.rows.map(row =>
      table.cols.map((_,i)=>{
        const cell = row.c && row.c[i];
        return cell ? (cell.f ?? cell.v ?? "") : "";
      })
    );

    render(allRows);

    status.textContent =
      "Updated " + new Date().toLocaleTimeString();

  }catch(error){
    status.textContent = "Connection error";
    document.getElementById("sheetTable").innerHTML = `
      <tbody>
        <tr>
          <td class="empty">${escapeHtml(error.message)}</td>
        </tr>
      </tbody>`;
  }
}

document.getElementById("search").addEventListener("input", function(){
  const keyword = this.value.toLowerCase().trim();

  if(!keyword){
    render(allRows);
    return;
  }

  const filtered = allRows.filter(row =>
    row.some(value =>
      String(value).toLowerCase().includes(keyword)
    )
  );

  render(filtered);
});

loadSheet();
setInterval(loadSheet, REFRESH_MS);
</script>

</body>
</html>
