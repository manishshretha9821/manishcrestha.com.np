<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#DDF0FF">
<title>Share files</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #DDF0FF;
    --sky-soft: #BFE3FF;
    --ink: #14213D;
    --muted: #4A5A78;
    --panel: #FFFFFF;
    --sun: #FFC72C;
    --coral: #FF7A6B;
    --mint: #35D6A8;
    --mint-ink: #0B7A5E;
    --grape: #8E79FF;
    --grape-soft: #BCAEFF;
    --blue: #4DA8FF;
    --err: #C62828;
    --bw: 2.5px;
    --shadow: 6px 6px 0 var(--ink);
    --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0;
    background-color: var(--sky);
    background-image: radial-gradient(rgba(20, 33, 61, .09) 1.5px, transparent 1.5px);
    background-size: 22px 22px;
    color: var(--ink);
    font: 400 1rem/1.5 var(--body);
  }
  .page {
    max-width: 760px; margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(56px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .card {
    background: var(--panel);
    border: var(--bw) solid var(--ink);
    border-radius: 28px;
    box-shadow: var(--shadow);
  }

  /* Profile header */
  .profile { overflow: hidden; text-align: center; margin-bottom: 28px; }
  .cover { position: relative; height: 124px; background: var(--grape); overflow: hidden; border-bottom: var(--bw) solid var(--ink); }
  .cover i { position: absolute; display: block; border: var(--bw) solid var(--ink); }
  .cover .s1 { width: 74px; height: 74px; border-radius: 50%; background: var(--sun); left: 7%; top: 22px; }
  .cover .s2 { width: 48px; height: 48px; border-radius: 10px; background: var(--coral); right: 12%; top: 16px; transform: rotate(18deg); }
  .cover .s3 { width: 34px; height: 34px; border-radius: 50%; background: var(--mint); left: 36%; bottom: 14px; }
  .cover .s4 { width: 58px; height: 58px; border-radius: 50%; background: transparent; border-color: #fff; right: 34%; bottom: -20px; }
  .cover .s5 { width: 28px; height: 28px; border-radius: 8px; background: var(--blue); left: 21%; top: 66px; transform: rotate(-14deg); }
  .cover .s6 { width: 40px; height: 40px; border-radius: 50%; background: var(--sky-soft); right: 4%; bottom: 10px; }
  .avatar {
    position: relative;
    width: 92px; height: 92px; margin: -46px auto 0;
    border-radius: 50%;
    background: var(--mint);
    border: var(--bw) solid var(--ink);
    box-shadow: 3px 3px 0 var(--ink);
    display: grid; place-items: center;
  }
  .avatar svg { width: 44px; height: 44px; }
  .profile-body { padding: 14px 24px 32px; }
  h1 {
    font: 600 clamp(2.4rem, 9vw, 3.4rem)/1.05 var(--display);
    margin: 12px 0 10px;
  }
  .profile p { margin: 0 auto; max-width: 44ch; color: var(--muted); font-size: 1.05rem; }

  /* Drop zone */
  .drop {
    position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    min-height: 290px;
    padding: 32px 24px;
    background: var(--sun);
    border: var(--bw) solid var(--ink);
    border-radius: 28px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .12s, box-shadow .12s, background-color .15s;
  }
  .drop::before {
    content: ""; position: absolute; inset: 12px;
    border: var(--bw) dashed rgba(20, 33, 61, .4);
    border-radius: 18px; pointer-events: none;
  }
  @media (hover: hover) {
    .drop:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
  }
  .drop:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--ink); }
  .drop.over { background: var(--mint); transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--ink); }
  .drop.over::before { border-style: solid; border-color: var(--ink); }
  .drop.over .up { animation: hop .45s ease-in-out infinite alternate; }
  @keyframes hop { to { transform: translateY(-8px); } }
  .drop:focus-within { outline: 3px solid var(--ink); outline-offset: 5px; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop .up {
    position: relative;
    width: 72px; height: 72px; margin-bottom: 14px;
    border-radius: 50%;
    background: var(--panel);
    border: var(--bw) solid var(--ink);
    display: grid; place-items: center;
  }
  .drop .up svg { width: 34px; height: 34px; }
  .drop strong { position: relative; font: 600 clamp(2rem, 6.5vw, 2.7rem)/1.05 var(--display); }
  .drop .sub { position: relative; display: block; margin-top: 8px; max-width: 34ch; }
  .drop em { font-style: normal; }
  .only-touch { display: none; }
  .pick {
    position: relative; margin-top: 18px; padding: 12px 26px;
    border-radius: 999px;
    background: var(--ink); color: #fff;
    font: 600 1.05rem var(--display);
  }

  /* Upload queue */
  .queue { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 12px; }
  .queue li {
    background: var(--panel);
    border: var(--bw) solid var(--ink);
    border-radius: 18px;
    box-shadow: 3px 3px 0 var(--ink);
    padding: 12px 16px 14px;
  }
  .q-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .q-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
  .q-status { font-size: .9rem; color: var(--muted); text-align: right; max-width: 60%; overflow-wrap: anywhere; }
  .q-status.ok { color: var(--mint-ink); font-weight: 600; }
  .q-status.err { color: var(--err); font-weight: 500; }
  .track { height: 14px; border-radius: 999px; background: var(--sky); border: 2px solid var(--ink); margin-top: 10px; overflow: hidden; }
  .fill { height: 100%; width: 100%; background: var(--mint); transform-origin: left; transform: scaleX(0); transition: transform .25s; }
  .q-retry { margin-top: 10px; }

  /* Buttons and inputs */
  button, .btn {
    display: inline-flex; align-items: center; justify-content: center;
    font: 600 .95rem/1.2 var(--body);
    color: var(--ink);
    background: var(--panel);
    border: var(--bw) solid var(--ink);
    border-radius: 999px;
    padding: 9px 18px;
    box-shadow: 2px 2px 0 var(--ink);
    cursor: pointer;
    text-decoration: none;
    transition: transform .1s, box-shadow .1s;
  }
  @media (hover: hover) {
    button:hover, .btn:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
  }
  button:active, .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .btn.primary { background: var(--mint); }
  button:focus-visible, .btn:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  input[type=search] {
    flex: 1 1 140px; min-width: 0; max-width: 280px;
    font: 500 1rem var(--body); color: var(--ink);
    background: var(--panel);
    border: var(--bw) solid var(--ink);
    border-radius: 999px;
    padding: 9px 16px;
  }
  input[type=search]::placeholder { color: var(--muted); }

  /* File list */
  .files { overflow: hidden; }
  .files-head {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    padding: 18px 20px;
    background: var(--sky-soft);
    border-bottom: var(--bw) solid var(--ink);
  }
  .files-head h2 { margin: 0; font: 600 1.7rem/1 var(--display); display: flex; align-items: center; gap: 10px; }
  .chip { background: var(--sun); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 11px; font: 600 .95rem/1.3 var(--display); }
  .chip:empty { display: none; }
  .tools { display: flex; gap: 10px; flex: 1 1 240px; justify-content: flex-end; }

  .rows { list-style: none; margin: 0; padding: 0; }
  .row {
    display: grid; grid-template-columns: 52px 1fr auto; gap: 14px; align-items: center;
    padding: 14px 20px;
    border-bottom: 2px dashed rgba(20, 33, 61, .2);
  }
  .row:last-child { border-bottom: 0; }
  .ext {
    width: 52px; height: 52px; border-radius: 14px;
    border: var(--bw) solid var(--ink);
    display: grid; place-items: center;
    font: 600 .85rem var(--display);
    background: var(--mint);
  }
  .ext.t-img { background: var(--coral); }
  .ext.t-doc { background: var(--blue); }
  .ext.t-zip { background: var(--sun); }
  .ext.t-media { background: var(--grape-soft); }
  .r-name { font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
  .r-meta { font-size: .9rem; color: var(--muted); }
  .r-act { display: flex; gap: 10px; align-items: center; }
  .note { padding: 44px 24px; text-align: center; color: var(--muted); font-size: 1.1rem; font-weight: 500; }
  .note.err { color: var(--err); }

  footer { margin-top: 34px; text-align: center; color: var(--muted); font-size: .95rem; }
  footer a { color: var(--ink); font-weight: 600; text-underline-offset: 3px; }
  footer p { margin: 4px 0; }

  .confetti { position: fixed; z-index: 50; pointer-events: none; border: 2px solid var(--ink); }

  /* Touch devices */
  @media (hover: none) and (pointer: coarse) {
    .only-pointer { display: none; }
    .only-touch { display: inline; }
    button, .btn { min-height: 46px; }
    input[type=search] { min-height: 46px; }
    * { -webkit-tap-highlight-color: transparent; }
  }

  /* Phones */
  @media (max-width: 560px) {
    :root { --shadow: 4px 4px 0 var(--ink); }
    .page { padding-top: max(18px, env(safe-area-inset-top)); }
    .profile { margin-bottom: 22px; }
    .cover { height: 100px; }
    .avatar { width: 80px; height: 80px; margin-top: -40px; }
    .avatar svg { width: 38px; height: 38px; }
    .profile-body { padding: 12px 18px 28px; }
    .drop { min-height: 250px; padding: 28px 18px; border-radius: 24px; }
    .drop::before { inset: 10px; border-radius: 15px; }
    .files-head { padding: 16px; }
    .tools { flex: 1 1 100%; }
    input[type=search] { max-width: none; }
    .row { grid-template-columns: 48px 1fr; padding: 14px 16px; gap: 12px 14px; }
    .ext { width: 48px; height: 48px; }
    .r-act { grid-column: 1 / -1; }
    .r-act .btn { flex: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="page">
  <header class="card profile">
    <div class="cover" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s5"></i><i class="s6"></i></div>
    <div class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 14c.8 1 1.8 1.5 3 1.5s2.2-.5 3-1.5"/></svg></div>
    <div class="profile-body">
      <h1>Share files</h1>
      <p>Drop a file and it lands in the shared folder. Anyone with this page can see it and download it.</p>
    </div>
  </header>

  <section class="upload" aria-label="Upload">
    <label class="drop" id="drop">
      <input type="file" id="file" multiple>
      <span class="up" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#14213D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></span>
      <strong><em class="only-pointer">Drop files here</em><em class="only-touch">Share a file</em></strong>
      <span class="sub">Any file type, up to <b class="maxmb">200</b> MB each.</span>
      <b class="pick">Choose files</b>
    </label>
    <ul class="queue" id="queue" aria-live="polite"></ul>
  </section>

  <section class="card files" aria-label="Shared files" style="margin-top:28px">
    <div class="files-head">
      <h2>Shared files <span class="chip" id="count"></span></h2>
      <div class="tools">
        <label class="sr" for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search files</label>
        <input type="search" id="q" placeholder="Search files">
        <button type="button" id="refresh">Refresh</button>
      </div>
    </div>
    <div id="list"><p class="note">Loading files…</p></div>
  </section>

  <footer>
    <p>Made by <a href="https://manishcrestha.com.np">manishcrestha.com.np</a></p>
    <p lang="sa">समस्ताः लोकः सुखिनो भवन्तु</p>
  </footer>
</main>

<script>
/* ---------- Settings ---------- */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-n7LosEXWB4q2nsHQC582MG-kEsx0DU84m549Ai1BF8DwQ8LlFJeBGXXyzoQzWKg/exec"; // the Apps Script /exec URL
const MAX_MB = 200;                               // keep in sync with Code.gs
const DIRECT_MAX = 15 * 1024 * 1024;              // keep in sync with Code.gs
/* ------------------------------- */

const CHUNK = 3 * 1024 * 1024; // must be a multiple of 256 KB
const $ = id => document.getElementById(id);
const configured = /^https:\/\/script\.google\.com\//.test(SCRIPT_URL);
let allFiles = [];
let uploading = 0;

document.querySelectorAll(".maxmb").forEach(n => n.textContent = MAX_MB);

/* ---------- helpers ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const toBase64 = blob => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(",")[1]);
  r.onerror = () => rej(r.error);
  r.readAsDataURL(blob);
});
function fmtSize(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  const u = ["KB", "MB", "GB"]; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < 2);
  return (n >= 10 ? n.toFixed(0) : n.toFixed(1)) + " " + u[i];
}
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
function extOf(name) {
  const m = /\.([A-Za-z0-9]{1,4})$/.exec(name);
  return m ? m[1].toLowerCase() : "file";
}
function catOf(name) {
  const e = extOf(name);
  if (/^(png|jpe?g|gif|webp|svg|psd|ai|heic|bmp|tiff?|eps|raw)$/.test(e)) return "t-img";
  if (/^(pdf|docx?|txt|rtf|odt|pptx?|xlsx?|csv|md)$/.test(e)) return "t-doc";
  if (/^(zip|rar|7z|tar|gz)$/.test(e)) return "t-zip";
  if (/^(mp3|wav|m4a|mp4|mov|mkv|avi|webm)$/.test(e)) return "t-media";
  return "t-other";
}
function burst(anchor) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = anchor.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const colors = ["#FFC72C", "#FF7A6B", "#35D6A8", "#8E79FF", "#4DA8FF"];
  for (let i = 0; i < 28; i++) {
    const p = document.createElement("span");
    const size = 8 + Math.random() * 8;
    p.className = "confetti";
    p.style.cssText = "width:" + size + "px;height:" + size + "px;background:" + colors[i % colors.length] +
      ";border-radius:" + (i % 3 === 0 ? "50%" : "3px") + ";left:" + cx + "px;top:" + cy + "px";
    document.body.append(p);
    const dx = (Math.random() - .5) * 360, up = 70 + Math.random() * 120, fall = 80 + Math.random() * 140, rot = (Math.random() - .5) * 720;
    p.animate([
      { transform: "translate(0,0) rotate(0deg)", opacity: 1 },
      { transform: "translate(" + dx * .6 + "px," + -up + "px) rotate(" + rot * .5 + "deg)", opacity: 1, offset: .4 },
      { transform: "translate(" + dx + "px," + fall + "px) rotate(" + rot + "deg)", opacity: 0 }
    ], { duration: 900 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.3,1)" }).onfinish = () => p.remove();
  }
}
async function api(body) {
  const opts = body ? { method: "POST", body: JSON.stringify(body) } : {};
  const url = body ? SCRIPT_URL : SCRIPT_URL + "?t=" + Date.now();
  const r = await fetch(url, opts);
  let j;
  try { j = await r.json(); }
  catch (e) { throw new Error("Unexpected reply. Check that the web app is deployed with access set to Anyone."); }
  if (j.error) throw new Error(j.error);
  return j;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

/* ---------- file list ---------- */
function renderList() {
  const term = $("q").value.trim().toLowerCase();
  const files = allFiles.filter(f => f.name.toLowerCase().includes(term));
  const box = $("list");
  box.replaceChildren();
  $("count").textContent = allFiles.length ? String(allFiles.length) : "";

  if (!files.length) {
    box.append(el("p", "note", allFiles.length ? "No files match your search." : "Nothing here yet. Be the first to share a file!"));
    return;
  }
  const ul = el("ul", "rows");
  for (const f of files) {
    const li = el("li", "row");
    li.append(el("div", "ext " + catOf(f.name), extOf(f.name)));

    const info = el("div");
    info.append(el("div", "r-name", f.name));
    info.append(el("div", "r-meta", [fmtSize(f.size), fmtDate(f.modified)].filter(Boolean).join(", ")));
    li.append(info);

    const act = el("div", "r-act");
    const dl = el("a", "btn primary", "Download");
    dl.href = "https://drive.google.com/uc?export=download&id=" + encodeURIComponent(f.id);
    const open = el("a", "btn", "Open");
    open.href = "https://drive.google.com/file/d/" + encodeURIComponent(f.id) + "/view";
    open.target = "_blank"; open.rel = "noopener";
    act.append(dl, open);
    li.append(act);
    ul.append(li);
  }
  box.append(ul);
}

async function loadFiles() {
  if (!configured) {
    $("list").replaceChildren(el("p", "note err", "This page isn’t connected to Google Drive yet. Add your Apps Script web app URL to SCRIPT_URL in index.html."));
    return;
  }
  try {
    const j = await api();
    allFiles = j.files || [];
    renderList();
  } catch (e) {
    if (!allFiles.length) $("list").replaceChildren(el("p", "note err", "Couldn’t load the files: " + e.message));
  }
}

/* ---------- uploads ---------- */
const pending = [];
let running = false;

function addToQueue(fileList) {
  for (const file of fileList) {
    const li = el("li");
    const top = el("div", "q-top");
    const name = el("span", "q-name", file.name);
    name.title = file.name;
    const status = el("span", "q-status", "Waiting");
    top.append(name, status);
    const track = el("div", "track");
    const fill = el("div", "fill");
    track.append(fill);
    li.append(top, track);
    $("queue").append(li);
    const item = { file, li, status, fill, track };

    if (!configured) { fail(item, "Not connected to Google Drive yet"); continue; }
    if (file.size === 0) { fail(item, "File is empty"); continue; }
    if (file.size > MAX_MB * 1024 * 1024) { fail(item, "Larger than " + MAX_MB + " MB"); continue; }
    pending.push(item);
  }
  if (matchMedia("(max-width: 919px)").matches) {
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("queue").scrollIntoView({ block: "nearest", behavior: calm ? "auto" : "smooth" });
  }
  run();
}

function fail(item, msg) {
  item.status.textContent = msg;
  item.status.className = "q-status err";
  if (!item.li.querySelector(".q-retry") && item.file.size > 0 && item.file.size <= MAX_MB * 1024 * 1024 && configured) {
    const b = el("button", "q-retry", "Try again");
    b.type = "button";
    b.onclick = () => {
      b.remove();
      item.status.className = "q-status"; item.status.textContent = "Waiting";
      item.fill.style.transform = "scaleX(0)";
      pending.push(item); run();
    };
    item.li.append(b);
  } else {
    setTimeout(() => item.li.remove(), 6000);
  }
}

async function run() {
  if (running) return;
  running = true;
  while (pending.length) {
    const item = pending.shift();
    uploading++;
    try {
      await uploadOne(item);
      item.status.textContent = "Uploaded!";
      item.status.className = "q-status ok";
      item.fill.style.transform = "scaleX(1)";
      burst(item.li);
      setTimeout(() => item.li.remove(), 6000);
      loadFiles();
    } catch (e) {
      fail(item, e.message || "Upload failed");
    }
    uploading--;
  }
  running = false;
}

async function uploadOne(item) {
  const file = item.file;
  const mime = file.type || "application/octet-stream";

  // Small files: one request
  if (file.size <= DIRECT_MAX) {
    item.status.textContent = "Uploading…";
    item.fill.style.transform = "scaleX(.4)";
    const data = await toBase64(file);
    await api({ action: "direct", name: file.name, mime, data });
    return;
  }

  // Large files: resumable upload in pieces
  item.status.textContent = "Starting…";
  const s = await api({
    action: "start",
    name: file.name,
    mime,
    size: file.size
  });
  let offset = 0;
  while (offset < file.size) {
    const end = Math.min(offset + CHUNK, file.size);
    const data = await toBase64(file.slice(offset, end));
    let res, tries = 0;
    for (;;) {
      try {
        res = await api({ action: "chunk", sessionUrl: s.sessionUrl, start: offset, total: file.size, data });
        break;
      } catch (e) {
        if (++tries >= 3) throw e;
        await sleep(1000 * tries);
      }
    }
    offset = end;
    const pct = Math.round(offset / file.size * 100);
    item.fill.style.transform = "scaleX(" + (offset / file.size) + ")";
    item.status.textContent = "Uploading " + pct + "%";
    if (res.done) return;
  }
}

/* ---------- events ---------- */
const drop = $("drop");
$("file").addEventListener("change", e => { addToQueue([...e.target.files]); e.target.value = ""; });

let depth = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); depth++; drop.classList.add("over"); });
document.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; drop.classList.remove("over"); } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault(); depth = 0; drop.classList.remove("over");
  if (e.dataTransfer && e.dataTransfer.files.length) addToQueue([...e.dataTransfer.files]);
});

$("q").addEventListener("input", renderList);
$("refresh").addEventListener("click", loadFiles);
window.addEventListener("beforeunload", e => { if (uploading) { e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadFiles(); });
setInterval(() => { if (!document.hidden && !uploading) loadFiles(); }, 60000);

loadFiles();
</script>
</body>
