<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Formula Reference</title>
<style>
  :root {
    --green: #1d6f42;
    --green-dark: #155331;
    --ink: #1f2933;
    --muted: #616e7c;
    --line: #dde3ea;
    --bg: #f3f5f7;
    --surface: #ffffff;
    --error: #b42318;
    --error-bg: #fef3f2;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
  }
  button, input, a { font: inherit; }
  :focus-visible { outline: 3px solid #7fc8a0; outline-offset: 2px; }

  /* ---------- Lock screen ---------- */
  .gate {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 36px 32px 32px;
    box-shadow: 0 8px 30px rgba(31, 41, 51, 0.08);
  }
  .badge {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: var(--green);
    color: #fff;
    display: grid; place-items: center;
    margin-bottom: 20px;
  }
  .card h1 { margin: 0 0 6px; font-size: 1.4rem; font-weight: 650; letter-spacing: -0.01em; }
  .card p.lead { margin: 0 0 24px; color: var(--muted); font-size: 0.95rem; }
  label { display: block; margin-bottom: 6px; font-size: 0.875rem; font-weight: 600; }
  .field { position: relative; }
  .field input {
    width: 100%;
    height: 44px;
    padding: 0 64px 0 14px;
    border: 1px solid #c3ccd6;
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
  }
  .field input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(29, 111, 66, 0.2); }
  .field.invalid input { border-color: var(--error); background: var(--error-bg); }
  .toggle {
    position: absolute; top: 4px; right: 4px;
    height: 36px; padding: 0 12px;
    border: 0; border-radius: 6px;
    background: transparent; color: var(--green);
    font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .toggle:hover { background: #eef6f1; }
  .error { min-height: 1.4em; margin: 8px 0 0; color: var(--error); font-size: 0.875rem; }
  .btn {
    width: 100%; height: 44px; margin-top: 12px;
    border: 0; border-radius: 8px;
    background: var(--green); color: #fff;
    font-weight: 600; cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover { background: var(--green-dark); }
  .card.shake { animation: shake 0.3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  /* ---------- Reference view ---------- */
  .viewer { display: none; height: 100%; flex-direction: column; }
  .viewer.open { display: flex; }
  header {
    flex: none;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand .badge { width: 34px; height: 34px; border-radius: 8px; margin: 0; }
  .brand h2 { margin: 0; font-size: 1.05rem; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .actions { display: flex; gap: 8px; flex: none; }
  .link, .ghost {
    display: inline-flex; align-items: center;
    height: 36px; padding: 0 14px;
    border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--ink);
    font-size: 0.875rem; font-weight: 600;
    text-decoration: none; cursor: pointer;
  }
  .link:hover, .ghost:hover { background: var(--bg); border-color: #c3ccd6; }
  main { flex: 1; min-height: 0; padding: 24px; display: flex; justify-content: center; }
  .doc {
    width: 100%; max-width: 960px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(31, 41, 51, 0.05);
  }
  iframe { display: block; width: 100%; height: 100%; border: 0; }

  @media (max-width: 600px) {
    header { padding: 10px 16px; }
    main { padding: 12px; }
    .link span { display: none; }
    .card { padding: 28px 22px 24px; }
  }
  @media (prefers-reduced-motion: reduce) { .card.shake { animation: none; } }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card" id="card">
    <div class="badge" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h1>Excel Formula Reference</h1>
    <p class="lead">This page is protected. Enter the password to continue.</p>
    <form id="form" novalidate>
      <label for="pw">Password</label>
      <div class="field" id="field">
        <input type="password" id="pw" autocomplete="current-password" autofocus aria-describedby="err">
        <button type="button" class="toggle" id="toggle" aria-label="Show password">Show</button>
      </div>
      <p class="error" id="err" role="alert"></p>
      <button type="submit" class="btn">Unlock</button>
    </form>
  </div>
</div>

<div class="viewer" id="viewer">
  <header>
    <div class="brand">
      <div class="badge" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
      </div>
      <h2>Excel Formula Reference</h2>
    </div>
    <div class="actions">
      <a class="link" id="open" target="_blank" rel="noopener" href="https://docs.google.com/document/d/e/2PACX-1vRfVWPIydUM18RF4iyK0M-p6y-b3K8fo63zjDYdyf6poEI3Gx1Pp7emYHs5VeaysYXTAveZK2SD-zN3/pub"><span>Open in new tab</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:6px" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
      <button type="button" class="ghost" id="lock">Lock</button>
    </div>
  </header>
  <main>
    <div class="doc">
      <iframe id="docFrame" title="Excel formula reference document"></iframe>
    </div>
  </main>
</div>

<script>
  var PASSWORD = "excel";
  var DOC_URL = "https://docs.google.com/document/d/e/2PACX-1vRfVWPIydUM18RF4iyK0M-p6y-b3K8fo63zjDYdyf6poEI3Gx1Pp7emYHs5VeaysYXTAveZK2SD-zN3/pub?embedded=true";

  var gate = document.getElementById("gate");
  var viewer = document.getElementById("viewer");
  var pw = document.getElementById("pw");
  var err = document.getElementById("err");
  var field = document.getElementById("field");
  var card = document.getElementById("card");
  var frame = document.getElementById("docFrame");

  function unlock() {
    gate.style.display = "none";
    viewer.classList.add("open");
    if (!frame.getAttribute("src")) frame.setAttribute("src", DOC_URL);
    try { sessionStorage.setItem("excelUnlocked", "1"); } catch (e) {}
  }

  function lock() {
    viewer.classList.remove("open");
    gate.style.display = "flex";
    pw.value = "";
    pw.focus();
    try { sessionStorage.removeItem("excelUnlocked"); } catch (e) {}
  }

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (pw.value === PASSWORD) {
      unlock();
    } else {
      err.textContent = "That password is incorrect. Check it and try again.";
      field.classList.add("invalid");
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
      pw.select();
    }
  });

  pw.addEventListener("input", function () {
    err.textContent = "";
    field.classList.remove("invalid");
  });

  document.getElementById("toggle").addEventListener("click", function () {
    var show = pw.type === "password";
    pw.type = show ? "text" : "password";
    this.textContent = show ? "Hide" : "Show";
    this.setAttribute("aria-label", show ? "Hide password" : "Show password");
  });

  document.getElementById("lock").addEventListener("click", lock);

  try { if (sessionStorage.getItem("excelUnlocked") === "1") unlock(); } catch (e) {}
</script>
</body>
</html>
